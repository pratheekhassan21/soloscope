[package]
name = "solscope"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bs58 = "0.5.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
dotenvy = "0.15.7"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "gzip", "http2", "charset"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
dotenvy = "0.15.7"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full", "test-util"] }
